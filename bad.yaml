# Fault 1: image does not exist (ImagePullBackOff)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image
  template:
    metadata:
      labels:
        app: bad-image
    spec:
      containers:
        - name: web
          image: nginx:this-tag-does-not-exist
---
# Fault 2: container exits with an error (CrashLoopBackOff)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crasher
  template:
    metadata:
      labels:
        app: crasher
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'DB_HOST not set' >&2; exit 1"]
---
# Fault 3: Service selector matches no Pods (no endpoints)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: api-v2
  ports:
    - port: 80
      targetPort: 80
---
# Fault 4: Pod cannot be scheduled (impossible resource request)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hungry
  template:
    metadata:
      labels:
        app: hungry
    spec:
      containers:
        - name: big
          image: nginx:1.27
          resources:
            requests:
              cpu: "64"
              memory: 512Gi
---
# Fault 5: PVC references a StorageClass that does not exist
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  storageClassName: premium-nvme-fast
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
